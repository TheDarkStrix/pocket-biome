[preset.0]
name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,assets/fonts/LICENSE*.txt"
exclude_filter="artifacts/*,docs/*,tests/*,tools/*,native/*,builds/*,*.md"
export_path="builds/PocketBiome-debug.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]
gradle_build/use_gradle_build=true
gradle_build/gradle_build_directory="res://android"
gradle_build/export_format=0
gradle_build/min_sdk="24"
gradle_build/target_sdk="36"
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=true
version/code=11
version/name="0.19.0-preview"
package/unique_name="com.thedarkstrix.pocketbiome"
package/name="Pocket Biome"
package/signed=true
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
permissions/vibrate=true
permissions/internet=true
permissions/access_network_state=true
user_data_backup/allow=false
keystore/debug="/workspace/runtime/android-user/debug.keystore"
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"

launcher_icons/main_192x192="res://assets/app_icon.png"
launcher_icons/adaptive_foreground_432x432="res://assets/app_icon.png"
launcher_icons/adaptive_background_432x432="res://assets/icon_background.svg"
